services:
  postgres:
    image: postgres:18-alpine
    container_name: xetaravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xetaravel
      POSTGRES_PASSWORD: xetaravel
      POSTGRES_DB: xetaravel
    ports:
      - "5442:5432"
    volumes:
      # PostgreSQL 18+ keeps its data in a versioned subdirectory of this mount.
      - postgres18_data:/var/lib/postgresql

  postgres_test:
    image: postgres:18-alpine
    container_name: xetaravel_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: xetaravel
      POSTGRES_PASSWORD: xetaravel
      POSTGRES_DB: xetaravel_test
    ports:
      - "5443:5432"
    tmpfs:
      - /var/lib/postgresql

volumes:
  postgres18_data:
