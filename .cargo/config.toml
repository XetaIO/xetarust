[env]
# ts-rs writes the generated TypeScript bindings straight into the frontend
# every time `cargo test` runs.
TS_RS_EXPORT_DIR = { value = "frontend/src/types/api", relative = true }
# Pagination counters are u64: expose them as plain JS numbers.
TS_RS_LARGE_INT = "number"

[alias]
# Test coverage (cargo-llvm-cov) without the code not worth covering:
# - backend/migration/        aggregator crate, CLI and test tooling
# - */migrations/             declarative DDL, run once
# - main.rs                   binaries (bootstrap / CLI)
# - */tests/                  integration tests (test code)
# - test_support.rs           use case fixtures (test code)
# - persistence/entit{y,ies}  SeaORM entities, generated by derives
# Separators are written `[\/]` to match both Windows and Linux paths.
cov = ["llvm-cov", "--workspace", "--ignore-filename-regex", 'backend[\/]migration[\/]|[\/]migrations[\/]|[\/]main\.rs$|[\/]tests[\/]|test_support\.rs$|[\/]persistence[\/]entit(y\.rs$|ies[\/])']
# Report of the last `cargo cov --no-report` run (same exclusions).
cov-report = ["llvm-cov", "report", "--ignore-filename-regex", 'backend[\/]migration[\/]|[\/]migrations[\/]|[\/]main\.rs$|[\/]tests[\/]|test_support\.rs$|[\/]persistence[\/]entit(y\.rs$|ies[\/])']
